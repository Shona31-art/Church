# Runs on every push and pull request. A failing type-check, lint, test or
# build blocks the merge — this is what enforces the project's standards
# automatically instead of relying on someone catching it by eye.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders so `next build` can compile. No real secrets in CI.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests (unit + database/RLS against real Postgres via PGlite)
        run: pnpm test
      - name: Build
        run: pnpm build
      # Browser tests for signed-out pages and access rules (e2e/public.spec.ts).
      # The signed-in role walkthroughs (e2e/roles.spec.ts) need a seeded test
      # Supabase project and are skipped here unless E2E_SEEDED is set.
      - name: Install browser for E2E
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests (E2E)
        run: pnpm test:e2e
        env:
          CI: "true"
      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
