<!doctype html>
<!--
  Shown by public/sw.js when a dashboard page is opened with no connection.
  Static and self-contained on purpose: it's saved once when the service
  worker installs, contains no personal data, and needs nothing from the
  server. Colours copy the tokens in app/globals.css (light and dark).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FDF7F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#140A19" media="(prefers-color-scheme: dark)" />
    <title>You're offline · Grace</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: 31 16 37;
        --parchment: 253 247 248;
        --surface: 255 255 255;
        --line: 240 225 231;
        --ember: 76 26 87;
        --on-ember: 255 246 250;
        --gold: 212 108 148;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: 250 238 244;
          --parchment: 20 10 25;
          --surface: 31 17 38;
          --line: 60 40 70;
          --ember: 240 160 190;
          --on-ember: 34 10 34;
          --gold: 236 140 176;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: rgb(var(--parchment));
        color: rgb(var(--ink));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      .brand { display: inline-flex; align-items: center; gap: 10px; font-family: Georgia, serif; font-style: italic; font-weight: 600; font-size: 22px; color: rgb(31 148 160); }
      main { flex: 1; display: flex; align-items: center; justify-content: center; }
      .card {
        width: 100%;
        max-width: 420px;
        background: rgb(var(--surface));
        border: 1px solid rgb(var(--line));
        border-radius: 16px;
        padding: 28px 24px;
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 4px 16px -4px rgb(0 0 0 / 0.06);
      }
      h1 { margin: 0; font-family: Georgia, serif; font-size: 28px; line-height: 1.2; letter-spacing: -0.015em; }
      .rule { width: 56px; height: 1px; background: linear-gradient(90deg, rgb(var(--gold)), rgb(var(--gold) / 0)); margin: 14px 0 16px; }
      p { margin: 0 0 12px; font-size: 15px; line-height: 1.55; color: rgb(var(--ink) / 0.75); }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 44px; padding: 0 18px; border-radius: 8px;
        font: 600 14px/1 inherit; font-family: inherit; text-decoration: none; cursor: pointer;
        touch-action: manipulation;
      }
      .primary { background: rgb(var(--ember)); color: rgb(var(--on-ember)); border: 0; }
      .secondary { background: rgb(var(--surface)); color: rgb(var(--ink)); border: 1px solid rgb(var(--line)); }
      .btn:focus-visible { outline: 2px solid rgb(var(--gold)); outline-offset: 2px; }
      .saved { list-style: none; margin: 4px 0 8px; padding: 0; display: grid; gap: 6px; }
      .saved a { display: block; padding: 10px 12px; border: 1px solid rgb(var(--line)); border-radius: 8px; color: rgb(var(--ink)); text-decoration: none; font-size: 14px; }
      .saved a:hover { background: rgb(var(--ink) / 0.04); }
    </style>
  </head>

    <main>
      <div class="card">
        <h1>You're offline</h1>
        <div class="rule" aria-hidden="true"></div>
        <p>This page needs an internet connection. Nothing you saved earlier has been lost.</p>
        <p>Bible versions you've downloaded still open without a connection — even signed out — and so do pages you opened recently:</p>
        <ul id="saved" class="saved" hidden></ul>
        <div class="actions">
          <button type="button" class="btn primary" onclick="location.reload()">Try again</button>
          <a class="btn secondary" id="bible" href="/bible">Open the Bible</a>
        </div>
      </div>
    </main>
    <script>
      // Pages saved for offline reading (public/sw.js: Home, Announcements,
      // Calendar, Songs, Sermons), newest first, named by their own titles.
      (async function () {
        try {
          if (!("caches" in window)) return;
          // Signed in on this phone: the member's reader (with its menu). Otherwise the public one.
          if (await caches.match("/dashboard/bible/read", { cacheName: "bible-shell-v1" })) document.getElementById("bible").href = "/dashboard/bible/read";
          var cache = await caches.open("app-pages-v1");
          var keys = (await cache.keys()).reverse().slice(0, 12);
          var list = document.getElementById("saved");
          for (var i = 0; i < keys.length; i++) {
            var url = new URL(keys[i].url);
            var res = await cache.match(keys[i]);
            var html = res ? await res.text() : "";
            var m = /<title>([^<]*)<\/title>/i.exec(html);
            var title = (m ? m[1] : url.pathname).replace(/ · Grace$| \| Grace$/, "").replace(/&amp;/g, "&").replace(/&#x27;|&#39;/g, "'");
            var li = document.createElement("li");
            var a = document.createElement("a");
            a.href = url.pathname + url.search;
            a.textContent = url.pathname === "/dashboard" ? "Home" : title;
            li.appendChild(a);
            list.appendChild(li);
          }
          if (keys.length) list.hidden = false;
        } catch (e) {
          // Nothing saved, or storage blocked.
        }
      })();
    </script>
  </body>
</html>
